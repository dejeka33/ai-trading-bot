name: Daily AI Trading Run

on:
  schedule:
    # 21:30 UTC = po zavření amerického akciového trhu (přibl. 23:30 letního / 22:30 zimního času v ČR)
    - cron: "30 21 * * *"
  workflow_dispatch: {}   # umožní i ruční spuštění tlačítkem v GitHub UI

permissions:
  contents: write   # potřeba pro commit reportu zpět do repozitáře

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily trading pipeline
        env:
          T212_API_ID: ${{ secrets.T212_API_ID }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_BASE_URL: "https://demo.trading212.com/api/v0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION_JSON: ${{ secrets.PUSH_SUBSCRIPTION_JSON }}
        run: python main.py

      - name: Commit report back to repo
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add reports/ docs/data/
          git diff --staged --quiet || git commit -m "Daily report $(date -u +%Y-%m-%d)"
          git push
