name: Daily AI Trading Run

on:
  # Vlastní GitHub cron vypnut 31.8.2026 - appku teď spouští cron-job.org
  # přes GitHub API (viz historie chatu), GitHubův scheduler byl nespolehlivý.
  # schedule:
  #   - cron: "0 14 * * *"   # 16:00 CEST
  #   - cron: "0 15 * * *"   # 16:00 CET
  workflow_dispatch: {}
permissions:
  contents: write   # potřeba pro commit reportu zpět do repozitáře

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Zkontrolovat, jestli je teď 16:00 českého času
        id: check_time
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Ruční spuštění (workflow_dispatch) - časová kontrola se přeskakuje, běží vždy."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ='Europe/Prague' date +%H)
          echo "Aktuální hodina v ČR (Europe/Prague, tzdata řeší přechod CET/CEST automaticky): $HOUR"
          if [ "$HOUR" = "16" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tenhle ze dvou naplánovaných běhů teď není ten správný pro aktuální CET/CEST - přeskakuji, spustí se ten druhý."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check_time.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run daily trading pipeline
        if: steps.check_time.outputs.should_run == 'true'
        env:
          T212_API_ID: ${{ secrets.T212_API_ID }}
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          T212_BASE_URL: "https://demo.trading212.com/api/v0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          # POZOR - přidáno 21.8.2026 (viz news_data.py) - volitelné, appka bez
          # tohohle klíče dál funguje stejně jako dřív (news=None).
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION_JSON: ${{ secrets.PUSH_SUBSCRIPTION_JSON }}
        run: python main.py

      - name: Commit report back to repo
        if: steps.check_time.outputs.should_run == 'true'
        run: |
          git config user.name "trading-bot"
          git config user.email "trading-bot@users.noreply.github.com"
          git add reports/ docs/data/
          git diff --staged --quiet || git commit -m "Daily report $(date -u +%Y-%m-%d)"
          git push
