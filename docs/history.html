<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>AI Trading Bot — Celá historie</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root {
    color-scheme: dark;
    --page:            #0d0d0d;
    --surface-1:       #1a1a19;
    --surface-2:       #212120;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --text-muted:      #898781;
    --border:          rgba(255,255,255,0.10);
    --baseline:        #383835;
    --good:            #0ca30c;
    --critical:        #e66767;
    --warning:         #fab219;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }
  header { padding: 28px 20px 8px; max-width: 880px; margin: 0 auto; }
  .back-link { display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); font-size: 12.5px; text-decoration: none; margin-bottom: 10px; }
  header h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  header p { margin: 0; color: var(--text-muted); font-size: 13px; }
  main { max-width: 880px; margin: 0 auto; padding: 16px 20px 0; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }

  /* --- Filtry --- */
  .filters { display: flex; flex-direction: column; gap: 10px; }
  .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .filter-field { display: flex; flex-direction: column; gap: 4px; }
  .filter-field label { font-size: 11px; color: var(--text-muted); }
  .filter-field select, .filter-field input {
    background: var(--surface-2); color: var(--text-primary); border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px; padding: 8px 9px; font-family: inherit; width: 100%;
  }
  .filter-field input[type="date"] { color-scheme: dark; }
  .filter-count { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .filter-reset {
    background: transparent; border: 1px solid var(--border); color: var(--text-secondary);
    font-size: 12.5px; padding: 8px 10px; border-radius: 8px; cursor: pointer; align-self: flex-start;
  }

  /* --- Denní log: box na den (stejný vzhled jako na dashboardu) --- */
  .log-list { display: flex; flex-direction: column; gap: 10px; }
  .log-day {
    border: 1px solid var(--border);
    border-left: 3px solid var(--text-muted);
    border-radius: 12px;
    overflow: hidden;
    background: var(--surface-2);
    cursor: pointer;
  }
  .log-day.accent-ok      { border-left-color: var(--good); }
  .log-day.accent-blocked { border-left-color: var(--warning); }
  .log-day.accent-none    { border-left-color: var(--baseline); }
  .log-day-header { display: flex; flex-wrap: wrap; row-gap: 6px; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); }
  .log-day-header-left { display: flex; align-items: center; gap: 9px; min-width: 0; flex-shrink: 1; }
  .log-day-date { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .log-day-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .log-day-value { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .log-day-chevron { font-size: 11px; color: var(--text-muted); transition: transform .15s; }
  .log-day.open .log-day-chevron { transform: rotate(180deg); }
  .log-day-body { padding: 12px 14px; }
  .log-day-summary { color: var(--text-secondary); font-size: 13px; line-height: 1.55; margin: 0; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); flex-shrink: 0; white-space: nowrap; }
  .badge.ok { color: var(--good); } .badge.blocked { color: var(--warning); } .badge.none { color: var(--text-muted); }
  .trade-detail { display: none; padding: 0 14px 14px; }
  .trade-detail.open { display: block; }
  .trade-line { padding: 8px 10px; margin-top: 6px; background: var(--surface-1); border-radius: 8px; font-size: 12.5px; }
  .trade-line .sym { font-weight: 600; }
  .trade-line .reasoning { color: var(--text-secondary); display: block; margin-top: 2px; }
  .empty-note { text-align: center; color: var(--text-muted); font-size: 13px; padding: 24px 0; }

  footer { max-width: 880px; margin: 24px auto 0; padding: 0 20px; color: var(--text-muted); font-size: 11px; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html">← Zpět na dashboard</a>
  <h1>Celá historie</h1>
  <p id="range-summary">Načítám data…</p>
</header>

<main>
  <section class="card filters">
    <div class="filter-row">
      <div class="filter-field">
        <label for="f-status">Stav</label>
        <select id="f-status">
          <option value="all">Vše</option>
          <option value="traded">Jen s obchodem</option>
          <option value="blocked">Jen blokované</option>
          <option value="none">Jen bez obchodu</option>
        </select>
      </div>
      <div></div>
      <div class="filter-field">
        <label for="f-from">Od</label>
        <input type="date" id="f-from">
      </div>
      <div class="filter-field">
        <label for="f-to">Do</label>
        <input type="date" id="f-to">
      </div>
    </div>
    <button class="filter-reset" id="f-reset">Zrušit filtry</button>
    <div class="filter-count" id="f-count"></div>
  </section>

  <section class="card">
    <div class="log-list" id="log-list"></div>
    <p class="empty-note" id="empty-note" style="display:none;">Žádné dny neodpovídají zvoleným filtrům.</p>
  </section>
</main>

<footer>Automaticky generováno GitHub Actions · data z Alpaca (paper trading) · rozhodnutí Claude</footer>

<script>
async function loadData() {
  const res = await fetch('./data/history.json?_=' + Date.now());
  if (!res.ok) throw new Error('Nepodařilo se načíst data.');
  return res.json();
}

let DATA = null;

function fmtUSD(v){ return '$' + v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ const dt = new Date(d+'T00:00:00Z'); return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}); }
// Kompaktní varianta (bez roku) pro hlavičku boxu, kde je málo místa - stejný
// formát jako na hlavním dashboardu, aby se datum + badge + hodnota vešly i na mobilu.
function fmtDateShort(d){ const dt = new Date(d+'T00:00:00Z'); return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short',timeZone:'UTC'}); }

function statusBadge(entry){
  if(entry.blocked_reasons && entry.blocked_reasons.length) return `<span class="badge blocked">⚠ blokováno</span>`;
  if(entry.trade_count > 0) return `<span class="badge ok">✓ ${entry.trade_count} obchod${entry.trade_count>1?'y':''}</span>`;
  return `<span class="badge none">bez obchodu</span>`;
}
function accentClass(entry){
  if(entry.blocked_reasons && entry.blocked_reasons.length) return 'accent-blocked';
  if(entry.trade_count > 0) return 'accent-ok';
  return 'accent-none';
}
function matchesStatus(e, status){
  if (status === 'traded') return e.trade_count > 0;
  if (status === 'blocked') return !!(e.blocked_reasons && e.blocked_reasons.length);
  if (status === 'none') return e.trade_count === 0 && !(e.blocked_reasons && e.blocked_reasons.length);
  return true;
}

function renderList(entries){
  const list = document.getElementById('log-list');
  const emptyNote = document.getElementById('empty-note');
  const rows = [...entries].reverse();

  if (rows.length === 0) {
    list.innerHTML = '';
    emptyNote.style.display = 'block';
    return;
  }
  emptyNote.style.display = 'none';

  list.innerHTML = rows.map((e, idx) => {
    const detailId = 'detail-' + idx;
    let detailContent = '';
    if (e.blocked_reasons && e.blocked_reasons.length) {
      detailContent = e.blocked_reasons.map(r => `<div class="trade-line">⚠ ${r}</div>`).join('');
    } else if (e.trades && e.trades.length) {
      detailContent = e.trades.map(t => `
        <div class="trade-line">
          <span class="sym">${t.symbol} · ${t.side==='buy'?'nákup':'prodej'} · ${t.qty}</span>
          ${t.status === 'submitted' ? '' : ' — <span style="color:var(--critical)">chyba: ' + (t.error || '') + '</span>'}
          <span class="reasoning">${t.reasoning || ''}</span>
        </div>`).join('');
    } else {
      detailContent = `<div class="trade-line" style="color:var(--text-muted)">Žádný obchod tento den.</div>`;
    }
    return `
      <div class="log-day ${accentClass(e)}" data-target="${detailId}">
        <div class="log-day-header">
          <div class="log-day-header-left">
            <span class="log-day-date">${fmtDateShort(e.date)}</span>
            ${statusBadge(e)}
          </div>
          <div class="log-day-header-right">
            <span class="log-day-value">${fmtUSD(e.portfolio_value)}</span>
            <span class="log-day-chevron">▾</span>
          </div>
        </div>
        <div class="log-day-body"><p class="log-day-summary">${e.market_summary || ''}</p></div>
        <div class="trade-detail" id="${detailId}">${detailContent}</div>
      </div>`;
  }).join('');

  list.querySelectorAll('.log-day').forEach(item => {
    item.addEventListener('click', () => {
      item.classList.toggle('open');
      document.getElementById(item.dataset.target).classList.toggle('open');
    });
  });
}

function applyFilters(){
  if (!DATA) return;
  const status = document.getElementById('f-status').value;
  const fromV = document.getElementById('f-from').value;
  const toV = document.getElementById('f-to').value;

  const filtered = DATA.entries.filter(e => {
    if (fromV && e.date < fromV) return false;
    if (toV && e.date > toV) return false;
    return matchesStatus(e, status);
  });

  document.getElementById('f-count').textContent =
    `Zobrazeno ${filtered.length} z ${DATA.entries.length} dní.`;
  renderList(filtered);
}

document.getElementById('f-status').addEventListener('change', applyFilters);
document.getElementById('f-from').addEventListener('change', applyFilters);
document.getElementById('f-to').addEventListener('change', applyFilters);
document.getElementById('f-reset').addEventListener('click', () => {
  document.getElementById('f-status').value = 'all';
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  applyFilters();
});

loadData().then(data => {
  if (!data.entries || !data.entries.length) {
    document.getElementById('range-summary').textContent = 'Zatím žádná data — počkej na první denní běh.';
    return;
  }
  DATA = data;
  const allDates = data.entries.map(e => e.date);
  document.getElementById('f-from').min = allDates[0];
  document.getElementById('f-from').max = allDates[allDates.length-1];
  document.getElementById('f-to').min = allDates[0];
  document.getElementById('f-to').max = allDates[allDates.length-1];
  document.getElementById('range-summary').textContent =
    `${fmtDate(allDates[0])} – ${fmtDate(allDates[allDates.length-1])} · ${allDates.length} dní celkem`;
  applyFilters();
}).catch(err => {
  document.getElementById('range-summary').textContent = 'Chyba při načítání dat: ' + err.message;
});
</script>

</body>
</html>
