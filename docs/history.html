<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b12">
<title>AI Trading Bot — Celá historie</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: dark;
    --page:        oklch(15% 0.025 265);
    --surface-1:   oklch(19% 0.025 265);
    --surface-2:   oklch(23% 0.028 265);
    --surface-3:   oklch(27% 0.03 265);
    --text-1:      oklch(97% 0.005 265);
    --text-2:      oklch(75% 0.01 265);
    --text-3:      oklch(58% 0.01 265);
    --text-4:      oklch(48% 0.01 265);
    --border:      oklch(100% 0 0 / 8%);
    --border-2:    oklch(100% 0 0 / 14%);
    --accent-1:    oklch(68% 0.16 258);
    --accent-2:    oklch(68% 0.16 305);
    --good:        oklch(72% 0.17 148);
    --good-ink:    oklch(82% 0.13 148);
    --critical:    oklch(70% 0.16 25);
    --critical-ink:oklch(80% 0.14 25);
    --warning:     oklch(78% 0.15 80);
    --warning-ink: oklch(85% 0.13 80);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--page); }
  body {
    margin: 0; color: var(--text-1);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 108px;
    position: relative; isolation: isolate;
  }
  .num { font-family: 'Space Grotesk', system-ui, sans-serif; font-variant-numeric: tabular-nums; }

  .blob-a { position: fixed; z-index: -1; width: 340px; height: 340px; left: 30%; top: -140px; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(circle, oklch(68% 0.16 258 / 20%), transparent 68%); filter: blur(48px); pointer-events: none; }
  .blob-b { position: fixed; z-index: -1; width: 320px; height: 320px; right: -160px; top: 420px;
    border-radius: 50%; background: radial-gradient(circle, oklch(68% 0.16 305 / 18%), transparent 68%); filter: blur(48px); pointer-events: none; }

  main { max-width: 460px; margin: 0 auto; padding: 22px 18px 0; position: relative; }

  .eyebrow-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--text-3); }
  .demo-chip { display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
    background: oklch(78% 0.15 80 / 14%); border: 1px solid oklch(78% 0.15 80 / 30%); }
  .demo-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
  .demo-chip span { font-size: 10.5px; font-weight: 600; color: var(--warning-ink); letter-spacing: .02em; }

  h1.page-title { font-size: 25px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .page-sub { font-size: 12.5px; color: var(--text-3); margin: 3px 0 18px; }

  .chip-row { display: flex; gap: 7px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .chip-row::-webkit-scrollbar { display: none; }
  .filter-chip { flex: none; padding: 7px 15px; border-radius: 999px; font-size: 12.5px; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); font-family: inherit; }
  .filter-chip.active { background: linear-gradient(135deg, var(--accent-1), var(--accent-2)); color: #fff; font-weight: 600; border-color: transparent; }

  .range-chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 13px; border-radius: 12px; background: var(--surface-1); border: 1px solid var(--border); margin-bottom: 8px; flex-wrap: wrap; }
  .range-chip svg { flex: none; }
  .date-input { background: transparent; border: none; color: var(--text-2); font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-variant-numeric: tabular-nums; color-scheme: dark; width: 108px; }
  .range-sep { color: var(--text-4); font-size: 12px; }
  .clear-btn { margin-left: auto; background: none; border: none; color: var(--accent-1); font-size: 11.5px; cursor: pointer; font-family: inherit; padding: 0; }

  .result-note { font-size: 11.5px; color: var(--text-4); margin: 0 0 20px; }

  .month-divider { font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--text-4); margin: 0 0 10px; }
  .month-divider:not(:first-child) { margin-top: 18px; }

  .day-list { display: flex; flex-direction: column; gap: 9px; }
  .day-card { border-radius: 18px; background: var(--surface-1); border: 1px solid var(--border); padding: 14px;
    display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
  .day-card.blocked { border-color: oklch(78% 0.15 80 / 25%); }
  .day-icon { width: 42px; height: 42px; border-radius: 13px; flex: none; display: flex; align-items: center; justify-content: center; }
  .day-icon.ok { background: oklch(72% 0.17 148 / 14%); border: 1px solid oklch(72% 0.17 148 / 35%); box-shadow: 0 0 16px oklch(72% 0.17 148 / 25%); }
  .day-icon.blocked { background: oklch(78% 0.15 80 / 14%); border: 1px solid oklch(78% 0.15 80 / 35%); box-shadow: 0 0 16px oklch(78% 0.15 80 / 25%); }
  .day-icon.none { background: var(--surface-3); border: 1px solid var(--border-2); }
  .day-date { font-size: 14px; font-weight: 600; }
  .day-status { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
  .day-status.blocked { color: var(--warning-ink); }
  .day-val { text-align: right; flex: none; }
  .day-main { font-size: 14px; font-weight: 700; }
  .day-delta { font-size: 11.5px; font-weight: 600; margin-top: 2px; }
  .day-delta.up { color: var(--good); } .day-delta.down { color: var(--critical); } .day-delta.flat { color: var(--text-3); }
  .day-chevron { flex: none; }
  .empty-state { color: var(--text-3); font-size: 13px; padding: 40px 0; text-align: center; }

  footer { max-width: 460px; margin: 22px auto 0; padding: 0 18px; color: var(--text-4); font-size: 10.5px; line-height: 1.6; }

  .tabbar-wrap { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; z-index: 30; pointer-events: none; }
  .tabbar { pointer-events: auto; width: calc(100% - 32px); max-width: 428px; height: 64px; border-radius: 22px;
    background: oklch(21% 0.03 265 / 92%); backdrop-filter: blur(14px); border: 1px solid var(--border-2);
    display: flex; box-shadow: 0 16px 40px -12px oklch(0% 0 0 / 55%); }
  .tab-link { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; text-decoration: none; color: var(--text-4); }
  .tab-link svg { stroke: var(--text-4); }
  .tab-link span { font-size: 10px; font-weight: 500; }
  .tab-link.active { color: var(--text-1); }
  .tab-link.active svg { stroke: var(--text-1); }
  .tab-link.active span { font-weight: 600; }
  .tab-link.active .tab-indicator { position: absolute; top: 8px; width: 26px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }

  .sheet-backdrop { position: fixed; inset: 0; background: oklch(0% 0 0 / 55%); opacity: 0; pointer-events: none; transition: opacity .22s ease; z-index: 40; }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 460px; margin: 0 auto;
    background: var(--surface-1); border: 1px solid var(--border-2); border-bottom: none; border-radius: 24px 24px 0 0;
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.22,.68,0,1); box-shadow: 0 -20px 60px oklch(0% 0 0 / 55%); }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border-2); margin: 2px auto 16px; }
  .sheet-header { display: flex; align-items: center; gap: 10px; }
  .sheet-title-wrap { flex: 1; min-width: 0; }
  .sheet-title { font-weight: 700; font-size: 15px; }
  .sheet-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .sheet-close { flex: none; width: 28px; height: 28px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 14px; cursor: pointer; }
  .sheet-meta { display: flex; gap: 18px; flex-wrap: wrap; margin: 16px 0; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .sm-label { font-size: 10.5px; color: var(--text-3); margin-bottom: 3px; }
  .sm-value { font-size: 13px; font-weight: 700; }
  .sheet-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
  .sheet-summary { font-size: 13.5px; line-height: 1.6; color: var(--text-2); margin: 0 0 16px; }
  .sheet-trade { padding: 10px 12px; margin-bottom: 8px; background: var(--surface-2); border-radius: 12px; font-size: 12.5px; }
  .sheet-trade .st-head { display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .sheet-trade .st-badge { font-size: 10.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); font-weight: 600; }
  .sheet-trade .st-badge.buy { color: var(--good); }
  .sheet-trade .st-reasoning { color: var(--text-2); display: block; margin-top: 5px; line-height: 1.5; }
  .sheet-blocked { padding: 10px 12px; margin-bottom: 8px; background: oklch(78% 0.15 80 / 8%); border: 1px solid oklch(78% 0.15 80 / 25%); border-radius: 12px; font-size: 12.5px; color: var(--warning-ink); }
</style>
</head>
<body>
<div class="blob-a"></div>
<div class="blob-b"></div>

<main>
  <div class="eyebrow-row">
    <div class="eyebrow">CELÁ HISTORIE</div>
    <div class="demo-chip"><div class="dot"></div><span>PAPER · DEMO</span></div>
  </div>

  <h1 class="page-title">Denní log</h1>
  <p class="page-sub" id="hist-sub">&nbsp;</p>

  <div class="chip-row" id="status-chips">
    <div class="filter-chip active" data-status="all">Vše</div>
    <div class="filter-chip" data-status="traded">Obchody</div>
    <div class="filter-chip" data-status="blocked">Blokováno</div>
    <div class="filter-chip" data-status="none">Bez obchodu</div>
  </div>

  <div class="range-chip">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-3)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <input type="date" class="date-input num" id="f-from">
    <span class="range-sep">—</span>
    <input type="date" class="date-input num" id="f-to">
    <button type="button" class="clear-btn" id="f-clear">Zrušit</button>
  </div>
  <p class="result-note" id="result-note"></p>

  <div id="list-wrap"></div>
</main>

<footer>Automaticky generováno GitHub Actions · data z Trading 212 (demo účet) · rozhodnutí Claude</footer>

<div class="tabbar-wrap">
  <nav class="tabbar">
    <a href="index.html" class="tab-link">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="4" height="8" rx="1"/><rect x="10" y="7" width="4" height="13" rx="1"/><rect x="16" y="3" width="4" height="17" rx="1"/></svg>
      <span>Přehled</span></a>
    <a href="positions.html" class="tab-link">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
      <span>Portfolio</span></a>
    <a href="history.html" class="tab-link active"><div class="tab-indicator"></div>
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
      <span>Historie</span></a>
  </nav>
</div>

<div class="sheet-backdrop" id="sheet-backdrop"></div>
<div class="bottom-sheet" id="bottom-sheet" role="dialog" aria-modal="true"></div>

<script>
async function loadData() {
  const res = await fetch('./data/history.json?_=' + Date.now());
  if (!res.ok) throw new Error('Nepodařilo se načíst data.');
  return res.json();
}

let CURRENCY = 'CZK';
function fmtMoney(v){
  if (CURRENCY === 'CZK') return v.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' Kč';
  return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + CURRENCY;
}
function fmtDate(d){ const dt = new Date(d+'T00:00:00Z'); return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short',timeZone:'UTC'}); }
function fmtDateFull(d){ const dt = new Date(d+'T00:00:00Z'); return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}); }
function fmtMonthLabel(d){ const dt = new Date(d+'T00:00:00Z'); return dt.toLocaleDateString('cs-CZ',{month:'long',year:'numeric',timeZone:'UTC'}).toUpperCase(); }
function dirClass(v){ return v > 0.005 ? 'up' : (v < -0.005 ? 'down' : 'flat'); }
function dirArrow(v){ return v > 0.005 ? '↓' : (v < -0.005 ? '↓' : '·'); }
function arrow(v){ return v > 0.005 ? '↑' : (v < -0.005 ? '↓' : '·'); }

const backdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('bottom-sheet');
function openSheetEl(){ backdrop.classList.add('open'); sheetEl.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet(){ backdrop.classList.remove('open'); sheetEl.classList.remove('open'); document.body.style.overflow = ''; }
backdrop.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function statusOf(entry){
  if (entry.blocked_reasons && entry.blocked_reasons.length) return 'blocked';
  if (entry.trade_count > 0) return 'ok';
  return 'none';
}
function nodeIcon(status){
  if (status === 'ok') return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(80% 0.15 148)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l6 6L20 6"/></svg>';
  if (status === 'blocked') return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(85% 0.13 80)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4L2 20h20L12 4z"/><path d="M12 10v4M12 17h.01"/></svg>';
  return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--text-4)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>';
}
function statusText(entry){
  const s = statusOf(entry);
  if (s === 'blocked') return 'Blokováno mantinely';
  if (s === 'ok') return entry.trade_count + (entry.trade_count === 1 ? ' obchod' : ' obchody');
  return 'Bez obchodu';
}
function matchesStatus(entry, filter){
  if (filter === 'all') return true;
  return statusOf(entry) === (filter === 'traded' ? 'ok' : filter);
}

let ALL_ENTRIES = [];
let currentStatus = 'all';

function applyFilters(){
  const from = document.getElementById('f-from').value;
  const to = document.getElementById('f-to').value;
  return ALL_ENTRIES.filter(e => {
    if (!matchesStatus(e, currentStatus)) return false;
    if (from && e.date < from) return false;
    if (to && e.date > to) return false;
    return true;
  });
}

function renderList(){
  const filtered = applyFilters();
  document.getElementById('result-note').textContent = `Zobrazeno ${filtered.length} z ${ALL_ENTRIES.length} dní.`;

  const wrap = document.getElementById('list-wrap');
  if (!filtered.length) {
    wrap.innerHTML = `<div class="empty-state">Žádné dny neodpovídají zvolenému filtru.</div>`;
    return;
  }

  const reversed = [...filtered].reverse();
  let html = '';
  let lastMonth = null;
  reversed.forEach(e => {
    const monthKey = e.date.slice(0, 7);
    if (monthKey !== lastMonth) { html += `<div class="month-divider">${fmtMonthLabel(e.date)}</div>`; lastMonth = monthKey; }
    const idx = ALL_ENTRIES.indexOf(e);
    const prev = idx > 0 ? ALL_ENTRIES[idx - 1].portfolio_value : e.portfolio_value;
    const chg = e.portfolio_value - prev;
    const chgPct = prev ? (chg / prev) * 100 : 0;
    const st = statusOf(e);
    html += `
      <button type="button" class="day-card ${st}" data-idx="${idx}">
        <div class="day-icon ${st}">${nodeIcon(st)}</div>
        <div style="flex:1;min-width:0;">
          <div class="day-date">${fmtDate(e.date)}</div>
          <div class="day-status ${st}">${statusText(e)}</div>
        </div>
        <div class="day-val">
          <div class="num day-main">${fmtMoney(e.portfolio_value)}</div>
          <div class="num day-delta ${dirClass(chg)}">${arrow(chg)} ${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)} %</div>
        </div>
        <svg class="day-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>`;
  });

  wrap.innerHTML = `<div class="day-list">${html}</div>`;
  wrap.querySelectorAll('.day-card').forEach(card => {
    card.addEventListener('click', () => openDaySheet(ALL_ENTRIES[+card.dataset.idx]));
  });
}

function openDaySheet(e){
  let tradesHtml;
  if (e.blocked_reasons && e.blocked_reasons.length) {
    tradesHtml = '<div class="sheet-label">Proč se neobchodovalo</div>' + e.blocked_reasons.map(r => `<div class="sheet-blocked">⚠ ${r}</div>`).join('');
  } else if (e.trades && e.trades.length) {
    tradesHtml = '<div class="sheet-label">Obchody</div>' + e.trades.map(t => `
        <div class="sheet-trade">
          <div class="st-head">${t.symbol || '?'}<span class="st-badge ${t.status==='submitted'?'buy':''}">${t.side==='buy'?'nákup':'prodej'}</span><span style="color:var(--text-3);font-weight:400;">${t.qty ?? '?'} ks</span></div>
          ${t.status !== 'submitted' ? `<span style="color:var(--critical);display:block;margin-top:4px;">⚠ chyba: ${t.error||''}</span>` : ''}
          ${t.reasoning ? `<span class="st-reasoning">${t.reasoning}</span>` : ''}
        </div>`).join('');
  } else {
    tradesHtml = '<div class="sheet-label">Obchody</div><p class="sheet-summary" style="color:var(--text-3);">Žádný obchod tento den.</p>';
  }
  const st = statusOf(e);
  sheetEl.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="day-icon ${st}" style="width:36px;height:36px;">${nodeIcon(st)}</div>
      <div class="sheet-title-wrap"><div class="sheet-title">${fmtDateFull(e.date)}</div><div class="sheet-sub">${statusText(e)}</div></div>
      <button type="button" class="sheet-close" id="sheet-close" aria-label="Zavřít">✕</button>
    </div>
    <div class="sheet-meta">
      <div><div class="sm-label">Hodnota portfolia</div><div class="sm-value">${fmtMoney(e.portfolio_value)}</div></div>
      <div><div class="sm-label">Obchodů</div><div class="sm-value">${e.trade_count}</div></div>
    </div>
    <div class="sheet-label">Shrnutí od AI</div>
    <p class="sheet-summary">${e.market_summary || '(bez shrnutí)'}</p>
    ${tradesHtml}
  `;
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  openSheetEl();
}

document.getElementById('status-chips').addEventListener('click', (ev) => {
  const chip = ev.target.closest('.filter-chip');
  if (!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
  currentStatus = chip.dataset.status;
  renderList();
});
document.getElementById('f-from').addEventListener('change', renderList);
document.getElementById('f-to').addEventListener('change', renderList);
document.getElementById('f-clear').addEventListener('click', () => {
  document.getElementById('f-from').value = '';
  document.getElementById('f-to').value = '';
  renderList();
});

loadData().then(data => {
  if (!data.entries || !data.entries.length) {
    document.getElementById('hist-sub').textContent = 'Zatím žádná data.';
    return;
  }
  CURRENCY = data.entries[data.entries.length - 1].currency || 'CZK';
  ALL_ENTRIES = data.entries;
  document.getElementById('hist-sub').textContent =
    `${fmtDate(ALL_ENTRIES[0].date)} – ${fmtDate(ALL_ENTRIES[ALL_ENTRIES.length-1].date)} · ${ALL_ENTRIES.length} dní celkem`;
  renderList();
}).catch(err => {
  console.error(err);
  document.getElementById('hist-sub').textContent = 'Nepodařilo se načíst data.';
});
</script>
</body>
</html>
