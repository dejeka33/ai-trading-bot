<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<title>AI Trading Bot — Dashboard</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root {
    color-scheme: dark;
    --page:            #0d0d0d;
    --surface-1:       #1a1a19;
    --surface-2:       #212120;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --text-muted:      #898781;
    --gridline:        #2c2c2a;
    --baseline:        #383835;
    --border:          rgba(255,255,255,0.10);
    --series-1:        #3987e5;   /* categorical slot 1, dark */
    --series-1-wash:   rgba(57,135,229,0.10);
    --good:            #0ca30c;
    --critical:        #e66767;
    --warning:         #fab219;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--page);
    color: var(--text-primary);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 48px;
  }

  header {
    padding: 28px 20px 8px;
    max-width: 880px;
    margin: 0 auto;
  }
  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 13px;
  }

  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 16px 20px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }

  /* --- Hero + stat tiles --- */
  .stat-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 560px) {
    .stat-row { grid-template-columns: 1fr; }
  }
  .stat-tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; }
  .stat-tile .label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
  .stat-tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: proportional-nums; }
  .stat-tile.hero .value { font-size: 40px; }
  .stat-tile .delta { font-size: 13px; margin-top: 6px; font-weight: 500; }
  .delta.up { color: var(--good); }
  .delta.down { color: var(--critical); }
  .delta.flat { color: var(--text-muted); }

  /* --- Chart card --- */
  .chart-card h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .chart-card .sub { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .chart-head { display: flex; justify-content: space-between; align-items: baseline; }
  .table-toggle {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 8px;
    cursor: pointer;
  }
  .table-toggle:hover { background: var(--surface-2); }

  svg.chart { width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--gridline); stroke-width: 1; }
  .baseline { stroke: var(--baseline); stroke-width: 1; }
  .series-line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .series-area { fill: var(--series-1-wash); }
  .end-dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
  .axis-label { fill: var(--text-muted); font-size: 11px; font-family: system-ui, sans-serif; }
  .end-label { fill: var(--text-primary); font-size: 12px; font-weight: 600; font-family: system-ui, sans-serif; }
  .hover-dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; opacity: 0; }
  .crosshair { stroke: var(--baseline); stroke-width: 1; opacity: 0; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text-primary);
    opacity: 0;
    transform: translate(-50%, -110%);
    white-space: nowrap;
    z-index: 5;
  }
  .tooltip .t-date { color: var(--text-muted); margin-bottom: 2px; }
  .chart-wrap { position: relative; }

  .empty-state { color: var(--text-muted); font-size: 13px; padding: 24px 0; text-align: center; }

  /* --- Table (used only for the chart's "table view" toggle) --- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .02em; padding: 0 10px 8px; }
  td { padding: 10px; border-top: 1px solid var(--gridline); vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

  /* --- Denní log: kartový seznam (čitelný na každé šířce, i na mobilu) --- */
  .log-list { display: flex; flex-direction: column; }
  .log-item {
    padding: 14px 4px;
    border-top: 1px solid var(--gridline);
    cursor: pointer;
  }
  .log-item:first-child { border-top: none; padding-top: 4px; }
  .log-item:hover { background: var(--surface-2); border-radius: 8px; }
  .log-item-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .log-item-date { font-weight: 600; font-size: 13.5px; white-space: nowrap; }
  .log-item-value { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
  .log-item-summary {
    color: var(--text-secondary);
    font-size: 13px;
    line-height: 1.55;
    margin: 0 0 8px;
  }
  .log-item-foot { display: flex; justify-content: space-between; align-items: center; }
  .log-item-hint { font-size: 11px; color: var(--text-muted); }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); flex-shrink: 0; }
  .badge.ok { color: var(--good); }
  .badge.blocked { color: var(--warning); }
  .badge.none { color: var(--text-muted); }

  .trade-detail { display: none; margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
  .trade-detail.open { display: block; }
  .trade-line { padding: 6px 0; border-bottom: 1px dashed var(--gridline); font-size: 12.5px; }
  .trade-line:last-child { border-bottom: none; }
  .trade-line .sym { font-weight: 600; }
  .trade-line .reasoning { color: var(--text-secondary); display: block; margin-top: 2px; }

  footer {
    max-width: 880px;
    margin: 24px auto 0;
    padding: 0 20px;
    color: var(--text-muted);
    font-size: 11px;
  }
</style>
</head>
<body>

<header>
  <h1>AI Trading Bot</h1>
  <p id="last-updated">Načítám data…</p>
</header>

<main>
  <section class="stat-row" id="stat-row"></section>

  <section class="card chart-card">
    <div class="chart-head">
      <div>
        <h2>Vývoj hodnoty portfolia</h2>
        <p class="sub" id="chart-sub">&nbsp;</p>
      </div>
      <button class="table-toggle" id="toggle-table-view" aria-pressed="false">Zobrazit jako tabulku</button>
    </div>
    <div class="chart-wrap" id="chart-wrap"></div>
  </section>

  <section class="card">
    <h2 style="font-size:14px;font-weight:600;margin:0 0 2px;">Denní log</h2>
    <p class="sub" style="font-size:12px;color:var(--text-muted);margin:0 0 12px;">Klikni na řádek pro detail obchodů a zdůvodnění AI.</p>
    <div class="log-list" id="log-list"></div>
  </section>
</main>

<footer>
  Automaticky generováno GitHub Actions · data z Alpaca (paper trading) · rozhodnutí Claude
</footer>

<script>
async function loadData() {
  const res = await fetch('./data/history.json?_=' + Date.now());
  if (!res.ok) throw new Error('Nepodařilo se načíst data.');
  return res.json();
}

function fmtUSD(v) {
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtUSDCompact(v) {
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function fmtDate(d) {
  const dt = new Date(d + 'T00:00:00Z');
  return dt.toLocaleDateString('cs-CZ', { day: 'numeric', month: 'short', timeZone: 'UTC' });
}

function renderStats(data) {
  const entries = data.entries;
  const last = entries[entries.length - 1];
  const start = data.starting_value ?? last.portfolio_value;
  const delta = last.portfolio_value - start;
  const deltaPct = start ? (delta / start) * 100 : 0;
  const dirClass = delta > 0.005 ? 'up' : (delta < -0.005 ? 'down' : 'flat');
  const arrow = delta > 0.005 ? '↑' : (delta < -0.005 ? '↓' : '·');

  document.getElementById('stat-row').innerHTML = `
    <div class="stat-tile hero">
      <div class="label">Aktuální hodnota portfolia</div>
      <div class="value">${fmtUSD(last.portfolio_value)}</div>
      <div class="delta ${dirClass}">${arrow} ${fmtUSD(Math.abs(delta))} (${deltaPct.toFixed(2)}%) od začátku</div>
    </div>
    <div class="stat-tile">
      <div class="label">Hotovost</div>
      <div class="value">${fmtUSD(last.cash)}</div>
    </div>
    <div class="stat-tile">
      <div class="label">Kupní síla</div>
      <div class="value">${fmtUSD(last.buying_power)}</div>
    </div>
  `;

  document.getElementById('last-updated').textContent =
    'Poslední aktualizace: ' + fmtDate(last.date) + ' · ' + entries.length + ' ' +
    (entries.length === 1 ? 'den v historii' : 'dní v historii');
}

function renderChart(data) {
  const wrap = document.getElementById('chart-wrap');
  const entries = data.entries;

  if (entries.length < 2) {
    document.getElementById('chart-sub').textContent = 'Historie se teprve začíná budovat.';
    wrap.innerHTML = `<div class="empty-state">Zatím je k dispozici jen jeden den dat — graf se objeví, jakmile přibude druhý den historie.</div>`;
    document.getElementById('toggle-table-view').style.display = 'none';
    return;
  }

  document.getElementById('chart-sub').textContent =
    fmtDate(entries[0].date) + ' – ' + fmtDate(entries[entries.length - 1].date);

  const W = 800, H = 260, padL = 56, padR = 16, padT = 16, padB = 28;
  const plotW = W - padL - padR, plotH = H - padT - padB;

  const values = entries.map(e => e.portfolio_value);
  let min = Math.min(...values), max = Math.max(...values);
  if (min === max) { min -= 1; max += 1; }
  const pad = (max - min) * 0.12;
  min -= pad; max += pad;

  const x = i => padL + (i / (entries.length - 1)) * plotW;
  const y = v => padT + plotH - ((v - min) / (max - min)) * plotH;

  const ticks = 4;
  let gridSvg = '', labelSvg = '';
  for (let t = 0; t <= ticks; t++) {
    const v = min + (t / ticks) * (max - min);
    const yy = y(v);
    gridSvg += `<line class="gridline" x1="${padL}" x2="${W - padR}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}" />`;
    labelSvg += `<text class="axis-label" x="${padL - 8}" y="${(yy + 4).toFixed(1)}" text-anchor="end">${fmtUSDCompact(v)}</text>`;
  }

  const linePts = entries.map((e, i) => `${x(i).toFixed(1)},${y(e.portfolio_value).toFixed(1)}`).join(' L ');
  const areaPts = `M ${x(0).toFixed(1)},${y(entries[0].portfolio_value).toFixed(1)} L ${linePts} L ${x(entries.length-1).toFixed(1)},${(padT+plotH).toFixed(1)} L ${x(0).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  const lastX = x(entries.length - 1), lastY = y(entries[entries.length - 1].portfolio_value);

  const xLabelIdxs = [0, entries.length - 1];
  let xLabels = '';
  xLabelIdxs.forEach(i => {
    xLabels += `<text class="axis-label" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${i===0?'start':'end'}">${fmtDate(entries[i].date)}</text>`;
  });

  let hoverDots = '';
  entries.forEach((e, i) => {
    hoverDots += `<circle class="hover-dot" data-i="${i}" r="6" cx="${x(i).toFixed(1)}" cy="${y(e.portfolio_value).toFixed(1)}" />`;
  });

  wrap.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="chart-svg">
      ${gridSvg}
      <line class="baseline" x1="${padL}" x2="${W - padR}" y1="${padT + plotH}" y2="${padT + plotH}" />
      <path class="series-area" d="${areaPts}" />
      <path class="series-line" d="M ${linePts}" />
      <circle class="end-dot" r="4.5" cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" />
      <text class="end-label" x="${(lastX - 8).toFixed(1)}" y="${(lastY - 12).toFixed(1)}" text-anchor="end">${fmtUSD(entries[entries.length-1].portfolio_value)}</text>
      ${labelSvg}
      ${xLabels}
      <line class="crosshair" id="crosshair" y1="${padT}" y2="${padT + plotH}" />
      ${hoverDots}
      <rect id="hover-capture" x="${padL}" y="${padT}" width="${plotW}" height="${plotH}" fill="transparent" />
    </svg>
    <div class="tooltip" id="tooltip"><div class="t-date" id="tt-date"></div><div id="tt-value"></div></div>
  `;

  const svg = document.getElementById('chart-svg');
  const capture = document.getElementById('hover-capture');
  const tooltip = document.getElementById('tooltip');
  const crosshair = document.getElementById('crosshair');
  const dots = [...svg.querySelectorAll('.hover-dot')];

  capture.addEventListener('mousemove', (ev) => {
    const rect = svg.getBoundingClientRect();
    const relX = ((ev.clientX - rect.left) / rect.width) * W;
    let closest = 0, closestDist = Infinity;
    entries.forEach((e, i) => {
      const d = Math.abs(x(i) - relX);
      if (d < closestDist) { closestDist = d; closest = i; }
    });
    dots.forEach(d => d.style.opacity = 0);
    dots[closest].style.opacity = 1;
    crosshair.style.opacity = 1;
    crosshair.setAttribute('x1', x(closest).toFixed(1));
    crosshair.setAttribute('x2', x(closest).toFixed(1));

    const e = entries[closest];
    tooltip.style.opacity = 1;
    tooltip.style.left = ((x(closest) / W) * 100) + '%';
    tooltip.style.top = ((y(e.portfolio_value) / H) * 100) + '%';
    document.getElementById('tt-date').textContent = fmtDate(e.date);
    document.getElementById('tt-value').textContent = fmtUSD(e.portfolio_value);
  });
  capture.addEventListener('mouseleave', () => {
    dots.forEach(d => d.style.opacity = 0);
    crosshair.style.opacity = 0;
    tooltip.style.opacity = 0;
  });

  document.getElementById('toggle-table-view').onclick = (ev) => {
    const pressed = ev.target.getAttribute('aria-pressed') === 'true';
    ev.target.setAttribute('aria-pressed', String(!pressed));
    ev.target.textContent = pressed ? 'Zobrazit jako tabulku' : 'Zobrazit jako graf';
    if (!pressed) {
      const rows = entries.map(e => `<tr><td>${fmtDate(e.date)}</td><td class="num">${fmtUSD(e.portfolio_value)}</td></tr>`).join('');
      wrap.innerHTML = `<table><thead><tr><th>Datum</th><th style="text-align:right;">Hodnota portfolia</th></tr></thead><tbody>${rows}</tbody></table>`;
    } else {
      renderChart(data);
    }
  };
}

function statusBadge(entry) {
  if (entry.blocked_reasons && entry.blocked_reasons.length) {
    return `<span class="badge blocked">⚠ blokováno mantinely</span>`;
  }
  if (entry.trade_count > 0) {
    return `<span class="badge ok">✓ ${entry.trade_count} obchod${entry.trade_count > 1 ? 'y' : ''}</span>`;
  }
  return `<span class="badge none">bez obchodu</span>`;
}

function renderLog(data) {
  const list = document.getElementById('log-list');
  const rows = [...data.entries].reverse();
  list.innerHTML = rows.map((e, idx) => {
    const detailId = 'detail-' + idx;
    let detailContent = '';
    if (e.blocked_reasons && e.blocked_reasons.length) {
      detailContent = e.blocked_reasons.map(r => `<div class="trade-line">⚠ ${r}</div>`).join('');
    } else if (e.trades && e.trades.length) {
      detailContent = e.trades.map(t => `
        <div class="trade-line">
          <span class="sym">${t.symbol} · ${t.side === 'buy' ? 'nákup' : 'prodej'} · ${t.qty}</span>
          ${t.status === 'submitted' ? '' : ' — <span style="color:var(--critical)">chyba: ' + (t.error || '') + '</span>'}
          <span class="reasoning">${t.reasoning || ''}</span>
        </div>`).join('');
    } else {
      detailContent = `<div class="trade-line" style="color:var(--text-muted)">Žádný obchod tento den.</div>`;
    }

    return `
      <div class="log-item" data-target="${detailId}">
        <div class="log-item-head">
          <span class="log-item-date">${fmtDate(e.date)}</span>
          <span class="log-item-value">${fmtUSD(e.portfolio_value)}</span>
        </div>
        <p class="log-item-summary">${e.market_summary || ''}</p>
        <div class="log-item-foot">
          ${statusBadge(e)}
          <span class="log-item-hint">detail ▾</span>
        </div>
        <div class="trade-detail" id="${detailId}">${detailContent}</div>
      </div>
    `;
  }).join('');

  list.querySelectorAll('.log-item').forEach(item => {
    item.addEventListener('click', () => {
      document.getElementById(item.dataset.target).classList.toggle('open');
    });
  });
}

loadData().then(data => {
  if (!data.entries || !data.entries.length) {
    document.getElementById('last-updated').textContent = 'Zatím žádná data — počkej na první denní běh.';
    return;
  }
  renderStats(data);
  renderChart(data);
  renderLog(data);
}).catch(err => {
  document.getElementById('last-updated').textContent = 'Chyba při načítání dat: ' + err.message;
});
</script>

</body>
</html>
