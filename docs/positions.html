<style>
  :root {
    color-scheme: dark;
    --page:        oklch(15% 0.025 265);
    --surface-1:   oklch(19% 0.025 265);
    --surface-2:   oklch(23% 0.028 265);
    --surface-3:   oklch(27% 0.03 265);
    --text-1:      oklch(97% 0.005 265);
    --text-2:      oklch(75% 0.01 265);
    --text-3:      oklch(58% 0.01 265);
    --text-4:      oklch(48% 0.01 265);
    --border:      oklch(100% 0 0 / 8%);
    --border-2:    oklch(100% 0 0 / 14%);
    --accent-1:    oklch(68% 0.16 258);
    --accent-2:    oklch(68% 0.16 305);
    --good:        oklch(72% 0.17 148);
    --good-ink:    oklch(82% 0.13 148);
    --critical:    oklch(70% 0.16 25);
    --critical-ink:oklch(80% 0.14 25);
    --warning:     oklch(78% 0.15 80);
    --warning-ink: oklch(85% 0.13 80);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--page); }
  body {
    margin: 0; color: var(--text-1);
    font-family: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 108px;
    position: relative; isolation: isolate;
  }
  .num { font-family: 'Space Grotesk', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  a { color: var(--accent-1); text-decoration: none; }

  .blob-a { position: fixed; z-index: -1; width: 380px; height: 380px; right: -140px; top: -100px;
    border-radius: 50%; background: radial-gradient(circle, oklch(68% 0.16 305 / 22%), transparent 70%); filter: blur(50px); pointer-events: none; }
  .blob-b { position: fixed; z-index: -1; width: 360px; height: 360px; left: -140px; top: 460px;
    border-radius: 50%; background: radial-gradient(circle, oklch(68% 0.16 258 / 16%), transparent 70%); filter: blur(50px); pointer-events: none; }

  main { max-width: 460px; margin: 0 auto; padding: 22px 18px 0; position: relative; }

  .eyebrow-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; color: var(--text-3); }
  .demo-chip { display: flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
    background: oklch(78% 0.15 80 / 14%); border: 1px solid oklch(78% 0.15 80 / 30%); }
  .demo-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); }
  .demo-chip span { font-size: 10.5px; font-weight: 600; color: var(--warning-ink); letter-spacing: .02em; }

  h1.page-title { font-size: 25px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .page-sub { font-size: 12.5px; color: var(--text-3); margin: 3px 0 20px; }

  .summary-bar { border-radius: 22px; background: var(--surface-1); border: 1px solid var(--border); padding: 18px; margin-bottom: 20px;
    display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .summary-bar .label { font-size: 11px; color: var(--text-3); margin-bottom: 6px; }
  .summary-bar .value { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  .pf-pill { display: flex; align-items: center; gap: 5px; padding: 7px 12px 7px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; }
  .pf-pill.up { background: oklch(72% 0.17 148 / 14%); border: 1px solid oklch(72% 0.17 148 / 30%); color: var(--good-ink); }
  .pf-pill.down { background: oklch(70% 0.16 25 / 14%); border: 1px solid oklch(70% 0.16 25 / 30%); color: var(--critical-ink); }
  .pf-pill.flat { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }

  .pos-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .pos-card { border-radius: 18px; background: var(--surface-1); border: 1px solid var(--border); padding: 14px;
    display: flex; align-items: center; gap: 12px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
  .avatar { width: 44px; height: 44px; border-radius: 14px; flex: none; display: flex; align-items: center; justify-content: center; }
  .avatar span { font-size: 12px; font-weight: 700; letter-spacing: .02em; }
  .pos-name { font-size: 14.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pos-meta { font-size: 11.5px; color: var(--text-3); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pos-val { text-align: right; flex: none; }
  .pos-mv { font-size: 14.5px; font-weight: 700; }
  .pos-pct { font-size: 12px; font-weight: 600; margin-top: 2px; }
  .pos-pct.up { color: var(--good); } .pos-pct.down { color: var(--critical); } .pos-pct.flat { color: var(--text-3); }

  .section-title { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .section-sub { font-size: 11.5px; color: var(--text-3); margin: 0 0 12px; line-height: 1.5; }
  .empty-card { border-radius: 18px; background: var(--surface-1); border: 1px dashed var(--border-2); padding: 22px 18px; text-align: center; }
  .empty-card svg { margin-bottom: 8px; }
  .empty-card p { font-size: 12.5px; color: var(--text-3); line-height: 1.5; margin: 0; }

  .closed-list { display: flex; flex-direction: column; gap: 10px; }
  .closed-card { border-radius: 18px; background: var(--surface-1); border: 1px solid var(--border); padding: 14px; cursor: pointer; }
  .closed-head { display: flex; align-items: center; gap: 10px; }
  .closed-head .avatar { width: 34px; height: 34px; border-radius: 11px; }
  .closed-head .avatar span { font-size: 10.5px; }
  .closed-title { font-size: 13.5px; font-weight: 600; }
  .closed-date { font-size: 11px; color: var(--text-3); margin-top: 1px; }
  .closed-pl { margin-left: auto; text-align: right; }
  .closed-pl .amt { font-size: 13.5px; font-weight: 700; }
  .closed-pl .pct { font-size: 11px; font-weight: 600; margin-top: 1px; }
  .closed-limit-note { font-size: 11px; color: var(--text-4); margin: 2px 0 12px; }

  footer { max-width: 460px; margin: 22px auto 0; padding: 0 18px; color: var(--text-4); font-size: 10.5px; line-height: 1.6; }

  .tabbar-wrap { position: fixed; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; z-index: 30; pointer-events: none; }
  .tabbar { pointer-events: auto; width: auto; height: 64px; border-radius: 22px; padding: 0 4px;
    background: oklch(21% 0.03 265 / 92%); backdrop-filter: blur(14px); border: 1px solid var(--border-2);
    display: flex; box-shadow: 0 16px 40px -12px oklch(0% 0 0 / 55%); }
  .tab-link { flex: 0 0 auto; width: 84px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; text-decoration: none; color: var(--text-4); }
  .tab-link svg { stroke: var(--text-4); }
  .tab-link span { font-size: 10px; font-weight: 500; }
  .tab-link.active { color: var(--text-1); }
  .tab-link.active svg { stroke: var(--text-1); }
  .tab-link.active span { font-weight: 600; }
  .tab-link.active .tab-indicator { position: absolute; left: 26px; right: 26px; bottom: 0; height: 1px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); }

  .sheet-backdrop { position: fixed; inset: 0; background: oklch(0% 0 0 / 55%); opacity: 0; pointer-events: none; transition: opacity .22s ease; z-index: 40; }
  .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
  .bottom-sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-width: 460px; margin: 0 auto;
    background: var(--surface-1); border: 1px solid var(--border-2); border-bottom: none; border-radius: 24px 24px 0 0;
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto;
    transform: translateY(100%); transition: transform .3s cubic-bezier(.22,.68,0,1); box-shadow: 0 -20px 60px oklch(0% 0 0 / 55%); }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle { width: 36px; height: 4px; border-radius: 999px; background: var(--border-2); margin: 2px auto 16px; }
  .sheet-header { display: flex; align-items: center; gap: 10px; }
  .sheet-title-wrap { flex: 1; min-width: 0; }
  .sheet-title { font-weight: 700; font-size: 15px; }
  .sheet-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .sheet-close { flex: none; width: 28px; height: 28px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); font-size: 14px; cursor: pointer; }
  .sheet-meta { display: flex; gap: 18px; flex-wrap: wrap; margin: 16px 0; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .sm-label { font-size: 10.5px; color: var(--text-3); margin-bottom: 3px; }
  .sm-value { font-size: 13px; font-weight: 700; }
  .sheet-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
  .sheet-summary { font-size: 13.5px; line-height: 1.6; color: var(--text-2); margin: 0 0 16px; }
</style>

<script>
async function loadData() {
  const res = await fetch('./data/history.json?_=' + Date.now());
  if (!res.ok) throw new Error('Nepodařilo se načíst data.');
  return res.json();
}

// POZOR - přidáno 2.9.2026 (viz tax_ledger.py) - samostatný soubor od
// history.json; do vytvoření appkou po prvním běhu appka vrátí 404, appka to
// bere jako "zatím žádná evidence", ne jako chybu (appka lot/daňové bloky v
// popup okně prostě vynechá).
async function loadTaxData() {
  try {
    const res = await fetch('./data/tax_ledger.json?_=' + Date.now());
    if (!res.ok) return null;
    return res.json();
  } catch (e) {
    return null;
  }
}
let TAX_DATA = null;

function timeTestThreshold(dateStr){
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCFullYear(d.getUTCFullYear() + 3);
  return d;
}

// Appka časový test zobrazovaný u OTEVŘENÝCH dávek (viz openPositionSheet/
// lotsHtml) - jen orientační odhad, appka bere aktuální okamžik v prohlížeči,
// ne appkou uložené UTC datum posledního běhu. Vrací i "done" (true/false/null),
// aby lotsHtml mohla box zabarvit stejně jako pos-pct u pozic v Portfoliu.
function lotTestState(lot){
  if (!lot.date) return { done: null, label: 'neznámé datum nákupu' };
  const threshold = timeTestThreshold(lot.date);
  const now = new Date();
  if (now >= threshold) return { done: true, label: 'časový test splněn (3 roky)' };
  const daysLeft = Math.ceil((threshold - now) / 86400000);
  return { done: false, label: `časový test za ${daysLeft} ${daysLeft === 1 ? 'den' : (daysLeft >= 2 && daysLeft <= 4 ? 'dny' : 'dní')}` };
}

function realizedEntriesForTrade(taxData, t){
  if (!taxData) return [];
  return (taxData.realized || []).filter(r => r.symbol === t.symbol && r.sell_date === t.date);
}

// Appka u UZAVŘENÉHO (prodaného) obchodu shrne, jestli appka vyhodnotila
// 3letý časový test jako splněný - viz tax_ledger.record_sell (appka páruje
// FIFO, jeden prodej může appkou být rozdělený mezi víc dávek s různým
// výsledkem, proto "částečně").
function taxTestSummary(entries){
  if (!entries.length) return null;
  const met = entries.filter(e => e.time_test_met === true).length;
  const unmet = entries.filter(e => e.time_test_met === false).length;
  const unknown = entries.filter(e => e.time_test_met === null).length;
  if (met > 0 && unmet === 0 && unknown === 0) return { label: 'ano (drženo 3+ roky)', cls: 'up' };
  if (unmet > 0 && met === 0 && unknown === 0) return { label: 'ne (drženo méně než 3 roky)', cls: 'down' };
  if (met === 0 && unmet === 0) return { label: 'nejisté (appka nezná přesné datum nákupu)', cls: 'flat' };
  return { label: 'částečně splněno (obchod appka spárovala s víc dávkami)', cls: 'flat' };
}

let CURRENCY = 'CZK';
function fmtMoney(v){
  if (CURRENCY === 'CZK') return v.toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' Kč';
  return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ' + CURRENCY;
}
function fmtDate(d){ const dt = new Date(d+'T00:00:00Z'); return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short',timeZone:'UTC'}); }
function fmtDateFull(d){ const dt = new Date(d+'T00:00:00Z'); return dt.toLocaleDateString('cs-CZ',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}); }
function fmtQty(q){ return q.toLocaleString('cs-CZ',{maximumFractionDigits:4}); }
function dirClass(v){ return v > 0.005 ? 'up' : (v < -0.005 ? 'down' : 'flat'); }
function dirArrow(v){ return v > 0.005 ? '↗' : (v < -0.005 ? '↘' : '·'); }

// Přidáno 24.8.2026 - hue přiřazení rozšířené pro nových 11 titulů (viz
// instruments.py). Na rozdíl od donutu v index.html tady tyhle barvy slouží
// jen jako ZÁLOŽNÍ odznak (viz avatarHtml níže) pro případ, že se logo firmy
// nepodaří načíst - primární identitu teď nese logo, ne barva, takže při 18
// odstínech necílíme na dokonalé odlišení (dataviz skill by pro tolik kategorií
// doporučil skládat do "Ostatní" - zde to ale řešit nemusíme, protože barva už
// není jediný nosič identity a vždy je vedle ní i text/ticker).
const CAT_HUES = {
  CSPX:258, AAPL:25, MSFT:148, NVDA:80, JNJ:340, GOOGL:190, AMZN:305,
  TSLA:10, V:55, WMT:95, KO:125, XOM:165, UNH:205, DIS:235, BA:275, MCD:295, COST:315, VZ:355,
};
function catColor(sym, a){ const h = CAT_HUES[sym]; return h != null ? `oklch(70% 0.16 ${h} / ${a})` : `oklch(55% 0.01 265 / ${a})`; }
function catInk(sym){ const h = CAT_HUES[sym]; return h != null ? `oklch(15% 0.02 ${h})` : `oklch(15% 0.01 265)`; }

const INSTRUMENT_NAMES = {
  CSPX: 'iShares Core S&P 500 ETF',
  EQQQ: 'Invesco EQQQ Nasdaq-100 ETF',
  AAPL: 'Apple',
  MSFT: 'Microsoft',
  GOOGL: 'Alphabet (Google)',
  AMZN: 'Amazon',
  JPM: 'JPMorgan Chase',
  JNJ: 'Johnson & Johnson',
  NVDA: 'Nvidia',
  TSLA: 'Tesla',
  V: 'Visa',
  WMT: 'Walmart',
  KO: 'Coca-Cola',
  XOM: 'ExxonMobil',
  UNH: 'UnitedHealth Group',
  DIS: 'Walt Disney',
  BA: 'Boeing',
  MCD: "McDonald's",
  COST: 'Costco Wholesale',
  VZ: 'Verizon Communications',
};
function initials(sym){ return sym.length <= 3 ? sym : sym.slice(0,2); }

// Přidáno 24.8.2026 - reálná loga firem místo textových zkratek (viz diskuze v
// chatu). Clearbit Logo API (nejběžnější "zdarma bez klíče" volba) byla v
// prosinci 2025 zrušená - appka proto používá favicon.im jako primární zdroj,
// s Google s2/favicons jako záložním, a pokud selžou OBA, spadne zpátky na
// barevný odznak s iniciálami (viz __logoFallback níže) - appka tedy nikdy
// nezůstane bez vizuální identity nástroje, i kdyby oba externí zdroje vypadly.
const TICKER_DOMAINS = {
  CSPX: 'ishares.com', EQQQ: 'invesco.com',
  AAPL: 'apple.com', MSFT: 'microsoft.com', GOOGL: 'google.com', AMZN: 'amazon.com',
  JPM: 'jpmorganchase.com', JNJ: 'jnj.com', NVDA: 'nvidia.com',
  TSLA: 'tesla.com', V: 'visa.com', WMT: 'walmart.com', KO: 'coca-cola.com',
  XOM: 'exxonmobil.com', UNH: 'unitedhealthgroup.com', DIS: 'disney.com',
  BA: 'boeing.com', MCD: 'mcdonalds.com', COST: 'costco.com', VZ: 'verizon.com',
};

function avatarHtml(symbol, size){
  const domain = TICKER_DOMAINS[symbol];
  const bg = catColor(symbol, '100%');
  const ink = catInk(symbol);
  const glow = catColor(symbol, '40%');
  const radius = Math.round(size * 0.32);
  if (!domain) {
    return `<div class="avatar" style="width:${size}px;height:${size}px;border-radius:${radius}px;background:${bg};box-shadow:0 0 0 1px oklch(100% 0 0 / 8%), 0 0 18px ${glow};">
      <span style="color:${ink};font-size:${Math.round(size*0.27)}px;">${initials(symbol)}</span>
    </div>`;
  }
  const imgSize = Math.round(size * 0.62);
  return `<div class="avatar" data-fallback-bg="${bg}" data-fallback-ink="${ink}"
      style="width:${size}px;height:${size}px;border-radius:${radius}px;background:oklch(97% 0.004 265);box-shadow:0 0 0 1px oklch(100% 0 0 / 10%), 0 0 16px ${glow};overflow:hidden;">
    <img src="https://a.favicon.im/${domain}?larger=true" alt="${symbol}" width="${imgSize}" height="${imgSize}"
      style="width:${imgSize}px;height:${imgSize}px;object-fit:contain;border-radius:6px;"
      onerror="window.__logoFallback(this, '${symbol}', '${domain}')">
  </div>`;
}

window.__logoFallback = function(img, symbol, domain){
  if (!img.dataset.triedFallback) {
    img.dataset.triedFallback = '1';
    img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=128`;
    return;
  }
  const wrap = img.closest('.avatar');
  if (!wrap) return;
  const size = wrap.offsetWidth || 44;
  wrap.style.background = wrap.dataset.fallbackBg;
  wrap.innerHTML = `<span style="color:${wrap.dataset.fallbackInk};font-size:${Math.round(size*0.27)}px;font-weight:700;">${initials(symbol)}</span>`;
};

const backdrop = document.getElementById('sheet-backdrop');
const sheetEl = document.getElementById('bottom-sheet');
function openSheetEl(){ backdrop.classList.add('open'); sheetEl.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeSheet(){ backdrop.classList.remove('open'); sheetEl.classList.remove('open'); document.body.style.overflow = ''; }
backdrop.addEventListener('click', closeSheet);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function lastBuyDateForSymbol(entries, symbol){
  for (let i = entries.length - 1; i >= 0; i--) {
    const trades = entries[i].trades || [];
    const t = trades.find(t => t.symbol === symbol && t.side === 'buy' && t.status === 'submitted');
    if (t) return entries[i].date;
  }
  return null;
}

// POZOR - přidáno 2.9.2026 (viz main.compute_dividend_delta v appce) - sečte
// dividendy pro JEDEN symbol napříč CELOU historií (ne jen posledním dnem) -
// dividend_items u každého dne jsou už znormalizované appkou na
// {symbol, amount, date, raw}, takže appka tady jen filtruje a sčítá.
function dividendsForSymbol(entries, symbol){
  let sum = 0;
  entries.forEach(e => (e.dividend_items || []).forEach(d => {
    if (d.symbol === symbol) sum += d.amount || 0;
  }));
  return sum;
}

function flattenTrades(entries){
  const out = [];
  entries.forEach(e => { (e.trades || []).forEach(t => out.push({ ...t, date: e.date })); });
  return out;
}

const CLOSED_LIMIT = 15;

function renderOpenPositions(data){
  const entries = data.entries;
  const last = entries[entries.length - 1];
  const positions = [...(last.positions || [])].sort((a, b) => b.market_value - a.market_value);
  const totalValue = positions.reduce((s, p) => s + p.market_value, 0);
  const totalUnrealized = positions.reduce((s, p) => s + p.unrealized_pl, 0);
  const totalTrades = entries.reduce((s, e) => s + (e.trade_count || 0), 0);

  const posWord = positions.length === 1 ? 'otevřená pozice' : (positions.length >= 2 && positions.length <= 4 ? 'otevřené pozice' : 'otevřených pozic');
  document.getElementById('pf-sub').textContent = `${positions.length} ${posWord} · ${totalTrades} ${totalTrades === 1 ? 'obchod' : (totalTrades >= 2 && totalTrades <= 4 ? 'obchody' : 'obchodů')} celkem`;

  document.getElementById('pf-summary').innerHTML = `
    <div>
      <div class="label">Tržní hodnota pozic</div>
      <div class="num value">${fmtMoney(totalValue)}</div>
    </div>
    <div class="pf-pill ${dirClass(totalUnrealized)}">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        ${totalUnrealized >= 0 ? '<path d="M17 17L7 7M7 17V7h10"/>' : '<path d="M7 7l10 10M17 7v10H7"/>'}
      </svg>
      <span class="num">${totalUnrealized >= 0 ? '+' : ''}${fmtMoney(totalUnrealized)}</span>
    </div>`;

  document.getElementById('pos-list').innerHTML = positions.map(p => {
    const buyDate = lastBuyDateForSymbol(entries, p.symbol);
    const name = INSTRUMENT_NAMES[p.symbol] || p.symbol;
    const pct = p.unrealized_plpc || 0;
    return `
      <button type="button" class="pos-card" data-symbol="${p.symbol}">
        ${avatarHtml(p.symbol, 44)}
        <div style="flex:1;min-width:0;">
          <div class="pos-name">${name}</div>
          <div class="pos-meta">${p.symbol} · ${fmtQty(p.qty)} ks · nakoupeno ${buyDate ? fmtDate(buyDate) : '?'}</div>
        </div>
        <div class="pos-val">
          <div class="num pos-mv">${fmtMoney(p.market_value)}</div>
          <div class="num pos-pct ${dirClass(pct)}">${dirArrow(pct)} ${pct >= 0 ? '+' : ''}${pct.toFixed(2)} %</div>
        </div>
      </button>`;
  }).join('');

  document.querySelectorAll('.pos-card').forEach(card => {
    card.addEventListener('click', () => {
      const p = positions.find(x => x.symbol === card.dataset.symbol);
      openPositionSheet(p, lastBuyDateForSymbol(entries, p.symbol), dividendsForSymbol(entries, p.symbol));
    });
  });
}

function openPositionSheet(p, buyDate, dividendTotal){
  const name = INSTRUMENT_NAMES[p.symbol] || p.symbol;
  const costBasis = p.qty * p.avg_entry_price;
  sheetEl.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      ${avatarHtml(p.symbol, 36)}
      <div class="sheet-title-wrap">
        <div class="sheet-title">${name}</div>
        <div class="sheet-sub">${p.symbol} · nakoupeno ${buyDate ? fmtDateFull(buyDate) : 'neznámo (chybí záznam v historii)'}</div>
      </div>
      <button type="button" class="sheet-close" id="sheet-close" aria-label="Zavřít">✕</button>
    </div>
    <div class="sheet-meta">
      <div><div class="sm-label">Množství</div><div class="sm-value">${fmtQty(p.qty)} ks</div></div>
      <div><div class="sm-label">Nákupní cena (celkem)</div><div class="sm-value">${fmtMoney(costBasis)}</div></div>
      <div><div class="sm-label">Aktuální hodnota (celkem)</div><div class="sm-value" style="color:${dirClass(p.market_value - costBasis)==='up'?'var(--good)':dirClass(p.market_value - costBasis)==='down'?'var(--critical)':'var(--text-1)'};">${dirArrow(p.market_value - costBasis)} ${fmtMoney(p.market_value)}</div></div>
    </div>
    <div class="sheet-meta" style="border-top:none;">
      <div><div class="sm-label">Průměrná cena</div><div class="sm-value">${fmtMoney(p.avg_entry_price)}</div></div>
      <div><div class="sm-label">Aktuální cena</div><div class="sm-value">${fmtMoney(p.current_price)}</div></div>
      <div><div class="sm-label">Zisk/ztráta</div><div class="sm-value" style="color:${dirClass(p.unrealized_pl)==='up'?'var(--good)':dirClass(p.unrealized_pl)==='down'?'var(--critical)':'var(--text-1)'};">${p.unrealized_pl>=0?'+':''}${fmtMoney(p.unrealized_pl)} (${p.unrealized_plpc>=0?'+':''}${p.unrealized_plpc.toFixed(2)} %)</div></div>
      ${dividendTotal ? `<div><div class="sm-label">Dividendy od téhle akcie</div><div class="sm-value" style="color:var(--good);">+${fmtMoney(dividendTotal)}</div></div>` : ''}
    </div>
    ${lotsHtml(p.symbol)}`;
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  openSheetEl();
}

// POZOR - přidáno 2.9.2026, přestylováno 2.9.2026 večer (na žádost v chatu) -
// appka tady ukáže jednotlivé otevřené nákupní dávky (FIFO) pro daný symbol,
// ať appka vidí, kdy jaká "porce" akcie splní 3letý časový test - ne jen
// jedno souhrnné datum posledního nákupu (to appka ukazuje výš, viz buyDate).
// Appka záměrně KAŽDOU dávku kreslí jako vlastní box ve STEJNÉM grafickém
// stylu jako karta pozice v sekci Portfolio (třídy .pos-card/.pos-name/
// .pos-meta/.pos-val/.pos-mv/.pos-pct z renderOpenPositions výše, appka je
// jen znovupoužívá) - místo loga appka do avatara vloží pořadové číslo dávky
// (barva podle stejné palety jako u pozice, viz catColor). "odhadnuto" značí
// dávku, kterou appka nasadila zpětně (appka neznala skutečné datum nákupu -
// viz tax_ledger.seed_initial_lots), tam appka časový test bere jen orientačně.
function lotsHtml(symbol){
  const lots = TAX_DATA && TAX_DATA.open_lots ? (TAX_DATA.open_lots[symbol] || []) : [];
  if (!lots.length) return '';
  const bg = catColor(symbol, '100%');
  const ink = catInk(symbol);
  let anyEstimated = false;
  const rows = lots.map((lot, i) => {
    const state = lotTestState(lot);
    const pctClass = state.done === true ? 'up' : 'flat';
    const total = lot.qty * lot.price;
    if (lot.estimated) anyEstimated = true;
    return `
      <div class="pos-card" style="cursor:default;">
        <div class="avatar" style="background:${bg};box-shadow:0 0 0 1px oklch(100% 0 0 / 8%);">
          <span style="color:${ink};">${i + 1}</span>
        </div>
        <div style="flex:1;min-width:0;">
          <div class="pos-name">${fmtDate(lot.date)}${lot.estimated ? '*' : ''}</div>
          <div class="pos-meta">${fmtQty(lot.qty)} ks · ${fmtMoney(lot.price)} / ks</div>
        </div>
        <div class="pos-val">
          <div class="pos-mv">${fmtMoney(total)}</div>
          <div class="pos-pct ${pctClass}">${state.label}</div>
        </div>
      </div>`;
  }).join('');
  const note = anyEstimated
    ? '<p class="sheet-note">* odhadnuto - appka neznala přesné datum nákupu, dávka je "nasazená" k datu, kdy appka tuhle evidenci začala vést.</p>'
    : '';
  return `<div class="sheet-label" style="margin-top:16px;">Nákupní dávky (FIFO, daňová evidence)</div>
    <div style="display:flex;flex-direction:column;gap:10px;">${rows}</div>${note}`;
}

function renderClosedTrades(data){
  const closed = flattenTrades(data.entries)
    .filter(t => t.side === 'sell' && t.status === 'submitted')
    .reverse();

  document.getElementById('closed-limit-note').textContent = closed.length > CLOSED_LIMIT
    ? `Zobrazeno posledních ${CLOSED_LIMIT} z ${closed.length}.` : '';

  const wrap = document.getElementById('closed-wrap');
  if (!closed.length) {
    wrap.innerHTML = `
      <div class="empty-card">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="var(--text-4)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
        <p>Appka zatím žádnou pozici neprodala —<br>všechny obchody dosud byly nákupy.</p>
      </div>`;
    return;
  }

  const shown = closed.slice(0, CLOSED_LIMIT);
  wrap.innerHTML = `<div class="closed-list">` + shown.map(t => {
    const name = INSTRUMENT_NAMES[t.symbol] || t.symbol;
    const hasPl = typeof t.realized_pl === 'number';
    return `
      <div class="closed-card" data-trade='${JSON.stringify(t).replace(/'/g, "&#39;")}'>
        <div class="closed-head">
          ${avatarHtml(t.symbol, 34)}
          <div style="min-width:0;flex:1;">
            <div class="closed-title">${name} <span style="color:var(--text-3);font-weight:400;">· ${fmtQty(t.qty)} ks</span></div>
            <div class="closed-date">${fmtDate(t.date)}${t.sell_price ? ' · ' + fmtMoney(t.sell_price) : ''}</div>
          </div>
          <div class="closed-pl">
            ${hasPl
              ? `<div class="amt num" style="color:${dirClass(t.realized_pl)==='up'?'var(--good)':'var(--critical)'};">${t.realized_pl>=0?'+':''}${fmtMoney(t.realized_pl)}</div>
                 <div class="pct num" style="color:${dirClass(t.realized_pl)==='up'?'var(--good)':'var(--critical)'};">${t.realized_pl_pct!=null ? (t.realized_pl_pct>=0?'+':'')+t.realized_pl_pct.toFixed(2)+' %' : ''}</div>`
              : `<div class="amt" style="color:var(--text-3);font-size:12px;">bez záznamu</div>`}
          </div>
        </div>
      </div>`;
  }).join('') + `</div>`;

  wrap.querySelectorAll('.closed-card').forEach(card => {
    card.addEventListener('click', () => openClosedSheet(JSON.parse(card.dataset.trade)));
  });
}

// POZOR - přidáno 2.9.2026 (viz tax_ledger.py/taxTestSummary výše) - appka u
// prodeje zobrazí, jestli vyhodnotila 3letý časový test jako splněný.
function taxTestHtml(t){
  const summary = taxTestSummary(realizedEntriesForTrade(TAX_DATA, t));
  if (!summary) return '';
  return `<div><div class="sm-label">Osvobozeno od daně (3+ roky)?</div><div class="sm-value" style="color:${summary.cls==='up'?'var(--good)':summary.cls==='down'?'var(--critical)':'var(--text-1)'};">${summary.label}</div></div>`;
}

function openClosedSheet(t){
  const name = INSTRUMENT_NAMES[t.symbol] || t.symbol;
  const hasPl = typeof t.realized_pl === 'number';
  sheetEl.innerHTML = `
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      ${avatarHtml(t.symbol, 36)}
      <div class="sheet-title-wrap">
        <div class="sheet-title">${name} · prodej</div>
        <div class="sheet-sub">${fmtDateFull(t.date)}</div>
      </div>
      <button type="button" class="sheet-close" id="sheet-close" aria-label="Zavřít">✕</button>
    </div>
    <div class="sheet-meta">
      <div><div class="sm-label">Množství</div><div class="sm-value">${fmtQty(t.qty)} ks</div></div>
      ${t.sell_price ? `<div><div class="sm-label">Cena prodeje</div><div class="sm-value">${fmtMoney(t.sell_price)}</div></div>` : ''}
      ${hasPl ? `<div><div class="sm-label">Realizovaný zisk/ztráta</div><div class="sm-value">${t.realized_pl>=0?'+':''}${fmtMoney(t.realized_pl)}</div></div>` : ''}
      ${taxTestHtml(t)}
    </div>
    <div class="sheet-label">Zdůvodnění AI</div>
    <p class="sheet-summary">${t.reasoning || '(bez záznamu)'}</p>`;
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  openSheetEl();
}

Promise.all([loadData(), loadTaxData()]).then(([data, taxData]) => {
  TAX_DATA = taxData;
  if (!data.entries || !data.entries.length) {
    document.getElementById('pf-sub').textContent = 'Zatím žádná data.';
    return;
  }
  CURRENCY = data.entries[data.entries.length - 1].currency || 'CZK';
  renderOpenPositions(data);
  renderClosedTrades(data);
}).catch(err => {
  console.error(err);
  document.getElementById('pf-sub').textContent = 'Nepodařilo se načíst data.';
});
</script>
